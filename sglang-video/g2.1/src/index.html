  <div id="mark">SGLang 动画课 · 第 1 集 · G2.1 样条（30s · 1080p25 · 技术纠错版）</div>
</div>
<script>
/* ===== G2.1 确定性时间轴：setT(t)（技术纠错版） ===== */
const NS='http://www.w3.org/2000/svg';
const E=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const sstep=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const eio=x=>{x=clamp(x,0,1);return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eob=x=>{x=clamp(x,0,1);const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2);};
let T=0;

/* 摄影机关键帧 [t, cx, cy, scale] */
const KF=[[0,330,210,1.60],[6.8,330,214,1.52],[9.2,640,520,1.02],[13.4,700,560,1.00],[16.8,990,600,1.14],[18.8,1600,580,1.02],[21.0,2350,540,0.78],[23.2,2600,520,0.90],[25.0,2900,500,0.92],[26.6,3700,480,0.80],[28.0,4020,470,0.78],[30.001,4050,470,0.78]];
function cam(t){
  let i=0; while(i<KF.length-2 && t>KF[i+1][0]) i++;
  const a=KF[i],b=KF[i+1],x=sstep((t-a[0])/(b[0]-a[0]||1));
  const cx=lerp(a[1],b[1],x),cy=lerp(a[2],b[2],x),s=lerp(a[3],b[3],x);
  E('world').style.transform=`translate(${960-cx*s}px, ${540-cy*s}px) scale(${s})`;
}
function pop(id,t0,dur=0.4){const el=E(id),x=clamp((T-t0)/dur,0,1);
  el.style.opacity=x<=0?0:Math.min(1,x*2.5);
  el.style.transform=x<=0?'scale(0)':`scale(${eob(x)})`;}
function fade(id,t0,dur=0.3,rev=false){const el=E(id),x=clamp((T-t0)/dur,0,1);
  el.style.opacity=rev?1-x:x; el.style.pointerEvents='none';}
function draw(id,t0,dur=0.5){const el=E(id),len=LEN[id];
  const x=clamp((T-t0)/dur,0,1);
  el.style.opacity=x<=0?0:1;
  el.style.strokeDasharray=len; el.style.strokeDashoffset=len*(1-eio(x));}
function move(id,t0,t1,x0,y0,x1,y1){const el=E(id),x=eio(clamp((T-t0)/(t1-t0),0,1));
  const op=clamp((T-t0)/0.2,0,1)*clamp((t1-T)/0.2,0,1);
  el.style.opacity=op<=0?0:1;
  el.style.transform=`translate(${lerp(x0,x1,x)}px,${lerp(y0,y1,x)}px)`;}

const LEN={};
function build(){
  const rows=E('itabrows'); const cols=['#7fb3e8','#79c7a3','#f5c24b','#b48ce8','#e0705f','#58c2b8','#7fb3e8','#79c7a3','#f5c24b','#b48ce8'];
  for(let r=0;r<5;r++){const g=document.createElementNS(NS,'g');g.setAttribute('id','itr'+r);
    for(let c=0;c<10;c++){const rc=document.createElementNS(NS,'rect');
      rc.setAttribute('x',2480+c*44);rc.setAttribute('y',290+r*82);rc.setAttribute('width',37);rc.setAttribute('height',58);
      rc.setAttribute('rx',5);rc.setAttribute('fill',cols[c]);rc.setAttribute('opacity',0.16+0.1*((r+c)%3));g.appendChild(rc);}
    rows.appendChild(g);}
  /* Hidden States 行（水平 5 块） */
  const hs=E('hsrow');
  for(let i=0;i<5;i++){
    const g=document.createElementNS(NS,'g');g.setAttribute('id','ih'+i);g.setAttribute('class','pp');
    const rc=document.createElementNS(NS,'rect');
    rc.setAttribute('x',3060+i*72);rc.setAttribute('y',438);rc.setAttribute('width',64);rc.setAttribute('height',56);rc.setAttribute('rx',9);
    rc.setAttribute('fill','url(#hrowG)');rc.setAttribute('stroke',i===2?'#f5c24b':'#4a6ba0');rc.setAttribute('stroke-width',i===2?2.6:1.8);
    const tx=document.createElementNS(NS,'text');tx.setAttribute('x',3060+i*72+32);tx.setAttribute('y',472);tx.setAttribute('text-anchor','middle');tx.setAttribute('fill','#dfe9f7');tx.setAttribute('font-size','16');tx.textContent='H'+('₁₂₃₄₅'[i]);
    g.appendChild(rc);g.appendChild(tx);hs.appendChild(g);}
  /* Q/K/V 三行 */
  function lane(pid,fill,stroke,labels,y,ids){
    const g=E(pid);
    for(let i=0;i<5;i++){
      const b=document.createElementNS(NS,'g');b.setAttribute('id',ids+i);b.setAttribute('class','pp');
      const rc=document.createElementNS(NS,'rect');
      rc.setAttribute('x',3580+i*100);rc.setAttribute('y',y);rc.setAttribute('width',92);rc.setAttribute('height',60);rc.setAttribute('rx',10);
      rc.setAttribute('fill',fill);rc.setAttribute('stroke',stroke);rc.setAttribute('stroke-width',2.2);
      const tx=document.createElementNS(NS,'text');tx.setAttribute('x',3580+i*100+46);tx.setAttribute('y',y+26);tx.setAttribute('text-anchor','middle');tx.setAttribute('fill','#dfe9f7');tx.setAttribute('font-size','19');tx.textContent=labels[i];
      const pt=document.createElementNS(NS,'text');pt.setAttribute('x',3580+i*100+46);pt.setAttribute('y',y+48);pt.setAttribute('text-anchor','middle');pt.setAttribute('fill','#7f97bd');pt.setAttribute('font-size','12');pt.textContent='位置'+(i+1);
      b.appendChild(rc);b.appendChild(tx);b.appendChild(pt);g.appendChild(b);}
  }
  lane('qrow','#2b2410','#f5c24b',['Q₁','Q₂','Q₃','Q₄','Q₅'],280,'iq');
  lane('krow','#12294a','#7fb3e8',['K₁','K₂','K₃','K₄','K₅'],440,'ik');
  lane('vrow','#0f2b20','#79c7a3',['V₁','V₂','V₃','V₄','V₅'],640,'iv');
  /* Attention 五阶段：Score 列（x4180 起，5 格对齐 K₁..K₅ 的视觉层） */
  const az=E('attzone');
  for(let i=0;i<5;i++){
    const y=300+i*76;
    const cn=document.createElementNS(NS,'line');
    cn.setAttribute('x1',3672+i*100);cn.setAttribute('y1',442);cn.setAttribute('x2',4146);cn.setAttribute('y2',y+28);
    cn.setAttribute('stroke','#3a5480');cn.setAttribute('stroke-width','2');az.appendChild(cn);
    const cell=document.createElementNS(NS,'g');cell.setAttribute('id','sc'+i);cell.setAttribute('class','pp');
    const rc=document.createElementNS(NS,'rect');rc.setAttribute('x',4150);rc.setAttribute('y',y);rc.setAttribute('width',80);rc.setAttribute('height',56);rc.setAttribute('rx',9);
    rc.setAttribute('fill',i<3?'#16294a':'#2a1a1f');rc.setAttribute('stroke',i<3?'#58c2b8':'#e0705f');rc.setAttribute('stroke-width','2');
    const wbar=document.createElementNS(NS,'rect');wbar.setAttribute('id','wbar'+i);wbar.setAttribute('x',4156);wbar.setAttribute('y',y+40);wbar.setAttribute('width',0);wbar.setAttribute('height',8);wbar.setAttribute('rx',4);
    wbar.setAttribute('fill',i<3?'#58c2b8':'#e0705f');wbar.setAttribute('opacity','0.95');
    const tv=document.createElementNS(NS,'text');tv.setAttribute('id','stv'+i);tv.setAttribute('x',4190);tv.setAttribute('y',y+24);tv.setAttribute('text-anchor','middle');tv.setAttribute('fill','#dfe9f7');tv.setAttribute('font-size','18');
    const pl=document.createElementNS(NS,'text');pl.setAttribute('x',4140);pl.setAttribute('y',y+34);pl.setAttribute('text-anchor','end');pl.setAttribute('fill','#7f97bd');pl.setAttribute('font-size','14');pl.textContent='K'+('₁₂₃₄₅'[i]);
    cell.appendChild(rc);cell.appendChild(wbar);cell.appendChild(tv);cell.appendChild(pl);az.appendChild(cell);
  }
  const q3l=document.createElementNS(NS,'line');
  q3l.setAttribute('x1',3826);q3l.setAttribute('y1',344);q3l.setAttribute('x2',4146);q3l.setAttribute('y2',288);
  q3l.setAttribute('stroke','#f5c24b');q3l.setAttribute('stroke-width','2.4');q3l.setAttribute('id','q3line');q3l.setAttribute('class','dr');
  az.appendChild(q3l);
  /* 权重×V：V_i → Σ 连线与 ×w 标签（第 4、5 位权重为 0） */
  const con=E('attzone');
  const WLBL=['×0.27','×0.40','×0.33','×0','×0'];
  for(let i=0;i<5;i++){
    const p=document.createElementNS(NS,'path');
    p.setAttribute('d',`M${3580+i*100+92} 700 L ${4356} 474`);
    p.setAttribute('fill','none');p.setAttribute('stroke',i<3?'#79c7a3':'#3a5480');p.setAttribute('stroke-width',i<3?2.4:1.6);
    p.setAttribute('stroke-dasharray',i<3?'':'6 6');p.setAttribute('id','wcon'+i);p.setAttribute('class','dr');
    if(i<3)p.setAttribute('marker-end','url(#arrG)');
    az.appendChild(p);
    const tg=document.createElementNS(NS,'g');tg.setAttribute('id','vtag'+i);tg.setAttribute('class','pp');
    const tt=document.createElementNS(NS,'text');tt.setAttribute('x',3626+i*100);tt.setAttribute('y',740);tt.setAttribute('text-anchor','middle');tt.setAttribute('fill',i<3?'#79c7a3':'#7f97bd');tt.setAttribute('font-size','16');tt.textContent=WLBL[i];
    tg.appendChild(tt);con.appendChild(tg);
  }
  ['rail','scan','qcuts','splitq','splitk','splitv','ropeQ','ropeK','vbyp','q3line','wcon0','wcon1','wcon2','wcon3','wcon4'].forEach(id=>{const p=E(id);if(p&&p.getTotalLength){try{LEN[id]=p.getTotalLength();}catch(e){LEN[id]=500;}}});
}
build();

/* 字幕（与配音逐句对齐；Tingting 为占位音） */
const SUB=[
 [0.50,5.19,'按下回车。你的问题，先被切成一块一块的 Token。'],
 [8.20,12.87,'请求拿到号牌，交给 Tokenizer，变成一串编号。'],
 [14.00,18.05,'调度器根据队列和调度策略，决定这一轮算谁。'],
 [20.25,25.77,'进入 Transformer：查表得到隐藏状态，再分成 Q、K、V。'],
 [25.79,29.99,'第 3 个 Q 只看前三，后两位被屏蔽——注意力。']
];
function sub(t){
  const box=E('sub'),tx=E('subtext');let s=null;
  for(const [a,b,txt] of SUB){ if(t>=a&&t<=b){s=txt;break;} }
  if(s){box.style.opacity=1;tx.textContent=s;}else{box.style.opacity=0;}
}

const SCORE=['4.1','5.2','4.6','3.9','3.7'], SCALED=['1.45','1.84','1.63','1.38','1.31'], WT=['27%','40%','33%','0%','0%'];
function setT(t){
  t=Math.max(0,Math.min(30,t)); T=t; window.T=T;
  cam(t); sub(t);
  /* ---- 0-8s：输入 + Tokenizer 切分（P0-1：边界→分离→ID 逐个映射） ---- */
  fade('ebox',0.2,0.4);
  const press=clamp((t-0.9)/0.4,0,1);
  E('ebtn').style.transformBox='fill-box';E('ebtn').style.transformOrigin='center';
  E('ebtn').style.transform=`scaleY(${1-0.18*Math.sin(Math.min(press*Math.PI,Math.PI))})`;
  E('pclipr').setAttribute('width',String(560*clamp((t-1.5)/1.6,0,1)));
  draw('qcuts',3.2,0.7);
  pop('qc0',3.9);pop('qc1',4.3);pop('qc2',4.7);pop('qc3',5.1);pop('qc4',5.5);
  pop('qnote',6.1,0.3);
  /* ---- 8-20s：API → Tokenizer（5⇄5）→ Scheduler（P0-5 文案） ---- */
  draw('rail',7.4,1.4);
  pop('napi',8.2); pop('req',8.6);
  move('req',9.0,9.9,330,392,80,392);
  pop('ar1',9.8,0.25); pop('ntok',10.2);
  pop('tid0',10.6);pop('tid1',11.0);pop('tid2',11.4);pop('tid3',11.8);pop('tid4',12.2);
  pop('ar2',12.9,0.25); pop('nsch',13.5); pop('schpol',13.8,0.35);
  pop('q41',14.2);pop('q42',14.6);pop('q43',15.0);
  draw('scan',15.4,1.0); fade('scan',16.4,0.3,true);
  move('req2',16.6,17.5,975,600,1086,600);
  fade('req2',17.8,0.35,true);
  /* ---- 20-30s：Transformer（P0-2/3/4） ---- */
  pop('ipanel',18.6,0.5);
  pop('ititle',20.3);
  pop('ich0',20.6);pop('ich1',20.9);pop('ich2',21.2);pop('ich3',21.5);pop('ich4',21.8);
  pop('ichlbl',22.0,0.3);
  fade('iar1',21.8,0.6);
  pop('itab',21.3,0.5);
  fade('itr0',22.1,0.3);fade('itr1',22.3,0.3);fade('itr2',22.5,0.3);fade('itr3',22.7,0.3);fade('itr4',22.9,0.3);
  fade('iext',23.0,0.5);
  pop('ih0',23.1);pop('ih1',23.3);pop('ih2',23.5);pop('ih3',23.7);pop('ih4',23.9);
  pop('ihlbl',24.0,0.3);
  /* 分流：Hidden → W_Q/W_K/W_V（P0-2：线性投影；RoPE 仅 Q/K） */
  draw('splitq',24.2,0.4);pop('wq',24.5);
  draw('splitk',24.6,0.4);pop('wk',24.9);
  draw('splitv',25.0,0.4);pop('wv',25.3);
  pop('iq0',25.5);pop('iq1',25.6);pop('iq2',25.7);pop('iq3',25.8);pop('iq4',25.9);
  pop('ik0',25.7);pop('ik1',25.8);pop('ik2',25.9);pop('ik3',26.0);pop('ik4',26.1);
  pop('iv0',25.9);pop('iv1',26.0);pop('iv2',26.1);pop('iv3',26.2);pop('iv4',26.3);
  pop('qlbl',26.0,0.3);pop('klbl',26.1,0.3);pop('vlbl',26.2,0.3);
  /* RoPE：仅 Q/K 旋转（旋转刻度持续），V 旁路 */
  draw('ropeQ',25.9,0.4);draw('ropeK',26.0,0.4);draw('vbyp',26.3,0.5);
  const ang=(T*140)%360;
  E('ropeQ').querySelector('line').setAttribute('transform',`rotate(${ang} 3562 310)`);
  E('ropeK').querySelector('line').setAttribute('transform',`rotate(${ang} 3562 470)`);
  /* Query = 第 3 个 Token（P0-4） */
  pop('q3hl',26.5,0.35);
  /* Attention 五阶段（P0-3） */
  pop('attscore',26.7,0.35);
  pop('scorelbl',27.0,0.3);
  draw('q3line',26.9,0.4);
  fade('wcon0',29.0,0.4);fade('wcon1',29.0,0.4);fade('wcon2',29.0,0.4);fade('wcon3',29.0,0.4);fade('wcon4',29.0,0.4);
  pop('vtag0',29.1,0.25);pop('vtag1',29.1,0.25);pop('vtag2',29.1,0.25);pop('vtag3',29.1,0.25);pop('vtag4',29.1,0.25);
  pop('sc0',27.1);pop('sc1',27.2);pop('sc2',27.3);pop('sc3',27.4);pop('sc4',27.5);
  /* Score → Scale → Mask → Softmax：单元格文本由 T 决定 */
  for(let i=0;i<5;i++){
    const tv=E('stv'+i);
    let v;
    if(t<27.0){ v=''; }
    else if(t<27.55){ v=SCORE[i]; }
    else if(t<28.10){ v=SCALED[i]; }
    else if(i<3){ v=WT[i]; } else { v='−∞'; }
    tv.textContent=v;
  }
  pop('sbadge',27.05,0.3);
  pop('mtxt',27.6,0.3);
  pop('softtxt',28.15,0.3);
  const hw=[0.9,0.9,0.83,0,0];
  for(let i=0;i<5;i++){E('wbar'+i).setAttribute('width',String(74*hw[i]*clamp((t-28.15)/0.55,0,1)));}
  /* 权重 × V → Σ 加权求和 */
  pop('sum',28.9,0.3);
  pop('outv',29.3,0.3);
}
window.setT=setT;
setT(0);
</script>
