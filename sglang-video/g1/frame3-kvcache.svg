    <text x="140" y="712" fill="#e8eefb" font-size="30">KV_bytes ＝ 2 (K和V) × 36 层 × 8 KV头 × 128 维 × 2 字节 ＝ <tspan fill="#f5c24b" font-weight="700">147,456 字节 / Token</tspan></text>
    <text x="140" y="756" fill="#7f97bd" font-size="22">Qwen3-4B-Thinking-2507 配置（L=36, n_kv=8, d_h=128, bf16）· 100 Token ≈ 14.06 · 101 Token ≈ 14.20 · 300 Token ≈ 42.19　（按 1024 进位，原文记作 MB）</text>
  </g>

