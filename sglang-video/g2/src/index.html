<script>
/* ===== 确定性时间轴：setT(t) —— 画面完全由 t 决定 ===== */
const NS='http://www.w3.org/2000/svg';
const E=id=>document.getElementById(id);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const lerp=(a,b,x)=>a+(b-a)*x;
const sstep=x=>{x=clamp(x,0,1);return x*x*(3-2*x);};
const eio=x=>{x=clamp(x,0,1);return x<0.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eob=x=>{x=clamp(x,0,1);const c=1.70158,c3=c+1;return 1+c3*Math.pow(x-1,3)+c*Math.pow(x-1,2);};

/* --- 摄影机关键帧 [t, cx, cy, scale] --- */
const KF=[[0,330,210,1.60],[6.8,330,214,1.52],[9.2,640,520,1.02],[13.0,700,560,1.00],[16.8,990,600,1.14],[19.0,1600,580,1.00],[21.6,2420,540,0.88],[23.2,2530,540,0.95],[26.0,3000,610,1.06],[28.8,3080,600,1.00],[30.001,3080,600,1.00]];
function cam(t){
  let i=0; while(i<KF.length-2 && t>KF[i+1][0]) i++;
  const a=KF[i],b=KF[i+1],x=sstep((t-a[0])/(b[0]-a[0]||1));
  const cx=lerp(a[1],b[1],x),cy=lerp(a[2],b[2],x),s=lerp(a[3],b[3],x);
  E('world').style.transform=`translate(${960-cx*s}px, ${540-cy*s}px) scale(${s})`;
}
function pop(id,t0,dur=0.4){const el=E(id),x=clamp((T-t0)/dur,0,1);
  el.style.opacity=x<=0?0:Math.min(1,x*2.5);
  el.style.transform=x<=0?'scale(0)':`scale(${eob(x)})`;}
function fade(id,t0,dur=0.3,rev=false){const el=E(id),x=clamp((T-t0)/dur,0,1);
  el.style.opacity=rev?1-x:x; el.style.pointerEvents='none';}
function draw(id,t0,dur=0.5){const el=E(id),len=LEN[id];
  const x=clamp((T-t0)/dur,0,1);
  el.style.opacity=x<=0?0:1;
  el.style.strokeDasharray=len; el.style.strokeDashoffset=len*(1-eio(x));}
function move(id,t0,t1,x0,y0,x1,y1){const el=E(id),x=eio(clamp((T-t0)/(t1-t0),0,1));
  const op=clamp((T-t0)/0.2,0,1)*clamp((t1-T)/0.2,0,1);
  el.style.opacity=op<=0?0:1;
  el.style.transform=`translate(${lerp(x0,x1,x)}px,${lerp(y0,y1,x)}px)`;}

/* --- JS 生成重复元素（嵌入表行 / 向量行 / 弧线 / 权重条） --- */
const LEN={};
function pathD(id){const p=E(id);try{LEN[id]=p.getTotalLength();}catch(e){LEN[id]=p.getTotalLength?800:800;}}
function buildRows(){
  const rows=E('itabrows');
  const cols=['#7fb3e8','#79c7a3','#f5c24b','#b48ce8','#e0705f','#58c2b8','#7fb3e8','#79c7a3','#f5c24b','#b48ce8'];
  for(let r=0;r<5;r++){
    const g=document.createElementNS(NS,'g'); g.setAttribute('id','itr'+r);
    for(let c=0;c<10;c++){
      const rc=document.createElementNS(NS,'rect');
      rc.setAttribute('x',2470+c*45); rc.setAttribute('y',290+r*82);
      rc.setAttribute('width',38); rc.setAttribute('height',58); rc.setAttribute('rx',5);
      rc.setAttribute('fill',cols[c]); rc.setAttribute('opacity',0.16+0.1*((r+c)%3));
      g.appendChild(rc);
    }
    rows.appendChild(g);
  }
  const vecs=E('ivecs');
  for(let r=0;r<5;r++){
    const y=260+r*92;
    const g=document.createElementNS(NS,'g'); g.setAttribute('id','iv'+r); g.setAttribute('class','pp');
    const k=document.createElementNS(NS,'rect');
    k.setAttribute('x',2870); k.setAttribute('y',y+14); k.setAttribute('width',44); k.setAttribute('height',28); k.setAttribute('rx',7);
    k.setAttribute('fill','#12294a'); k.setAttribute('stroke','#7fb3e8'); k.setAttribute('stroke-width','1.8');
